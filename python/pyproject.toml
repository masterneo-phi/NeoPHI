[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neophi"
version = "0.1.0"
description = "PHI (v5y) client in Python, using only the standard library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
phi-tui = "neophi.tui:main"
phi-cli = "neophi.cli:main"
phi-gui = "neophi.gui:main"

[tool.setuptools.packages.find]
include = ["neophi*"]
